name: backend-microservices-reference

# Stack de referencia: un broker Kafka (KRaft), un Postgres y el servicio de
# ejemplo (plantilla). Para un proyecto real, replica el bloque del servicio y su
# base de datos por cada microservicio.

services:
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - '9092:9094'
    environment:
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10

  example-db:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: example
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d example']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - example-db-data:/var/lib/postgresql/data

  example-service:
    build:
      context: .
      dockerfile: services/example-service/Dockerfile
    ports:
      - '3001:3001'
    environment:
      SERVICE_NAME: example-service
      PORT: '3001'
      DATABASE_URL: postgresql://app:app@example-db:5432/example?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: example-service
      KAFKA_GROUP_ID: example-service
    depends_on:
      kafka:
        condition: service_healthy
      example-db:
        condition: service_healthy

volumes:
  example-db-data:
