name: oms-microservices

services:
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - '9092:9094'
    environment:
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10

  orders-db:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
      POSTGRES_DB: orders
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oms -d orders']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - orders-db-data:/var/lib/postgresql/data

  inventory-db:
    image: postgres:16-alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
      POSTGRES_DB: inventory
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oms -d inventory']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - inventory-db-data:/var/lib/postgresql/data

  picking-db:
    image: postgres:16-alpine
    ports:
      - '5435:5432'
    environment:
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
      POSTGRES_DB: picking
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oms -d picking']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - picking-db-data:/var/lib/postgresql/data

  orders-service:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    ports:
      - '3001:3001'
    environment:
      SERVICE_NAME: orders-service
      PORT: '3001'
      DATABASE_URL: postgresql://oms:oms@orders-db:5432/orders?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: orders-service
      KAFKA_GROUP_ID: orders-service
    depends_on:
      kafka:
        condition: service_healthy
      orders-db:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    ports:
      - '3002:3002'
    environment:
      SERVICE_NAME: inventory-service
      PORT: '3002'
      DATABASE_URL: postgresql://oms:oms@inventory-db:5432/inventory?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: inventory-service
      KAFKA_GROUP_ID: inventory-service
    depends_on:
      kafka:
        condition: service_healthy
      inventory-db:
        condition: service_healthy

  picking-service:
    build:
      context: .
      dockerfile: services/picking/Dockerfile
    ports:
      - '3003:3003'
    environment:
      SERVICE_NAME: picking-service
      PORT: '3003'
      DATABASE_URL: postgresql://oms:oms@picking-db:5432/picking?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: picking-service
      KAFKA_GROUP_ID: picking-service
    depends_on:
      kafka:
        condition: service_healthy
      picking-db:
        condition: service_healthy

volumes:
  orders-db-data:
  inventory-db-data:
  picking-db-data:
